<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="image-container">
      <img src="img/background-img.jpg" alt="background">
      <div class="logo-container">
        <img src="img/odin-logo.png" alt="odin-logo">
        <h1>ODIN</h1>
      </div>
    </div>
    <div class="form-container">
      <div class="top-container">
        <p>
          This is not a real online service! You know you need something<br>
          like this in your life to help you realize your deepest dreams.<br>
          Sign up <em>now</em> to get started.
        </p>
        <p>
          You <em>know</em> you want to.
        </p>
      </div>
      <div class="middle-container">
        <form action="" method="get" id="contact-form">
          <h2>Let's do this!</h2>
          <section class="form-section">
            <div>
              <label for="first-name">FIRST NAME</label>
              <input type="text" id="first-name" name="user-first-name" required />
            </div>
            <div>
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="user-last-name" required />
            </div>
            <div>
              <label for="email">EMAIL</label>
              <input type="email" id="email" name="user-email" required />
            </div>
            <div>
              <label for="phone-num">PHONE NUMBER</label>
              <input type="tel" id="phone-num" name="user-phone-num" required />
            </div>
            <div>
              <label for="pwd">PASSWORD</label>
              <input type="password" id="pwd" name="user-password" required />
            </div>
            <div>
              <label for="cnfrm-pwd">CONFIRM PASSWORD</label>
              <input type="password" id="cnfrm-pwd" name="user-confirm-password" required />
            </div>
          </section>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
